<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zaiko - モバイル在庫・購入記録</title>
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
    {
      "imports": {
        "preact": "https://esm.sh/preact@10.20.1",
        "preact/hooks": "https://esm.sh/preact@10.20.1/hooks",
        "htm": "https://esm.sh/htm@3.1.1"

</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { h, render } from 'preact';
    import { useState, useEffect, useMemo } from 'preact/hooks';
    import htm from 'htm';

    const html = htm.bind(h);

    /* --- DATE UTILS --- */
    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseDate(dateStr) {
      const [year, month, day] = dateStr.split('-').map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '未記録';
      const [y, m, d] = dateStr.split('-');
      return `${y}/${m}/${d}`;
    }

    function getRelativeDateString(dateStr) {
      if (!dateStr) return '未記録';
      const target = parseDate(dateStr);
      const today = parseDate(getTodayString());

      const diffMs = today.getTime() - target.getTime();
      const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffDays === 0) return '今日';
      if (diffDays === 1) return '昨日';
      if (diffDays > 1 && diffDays < 7) return `${diffDays}日前`;
      if (diffDays >= 7 && diffDays < 30) {
        const weeks = Math.floor(diffDays / 7);
        return `${weeks}週間前`;
      }
      if (diffDays >= 30 && diffDays < 365) {
        const months = Math.floor(diffDays / 30);
        return `${months}か月前`;
      }
      if (diffDays >= 365) {
        return formatDate(dateStr);
      }
      return `${Math.abs(diffDays)}日後`;
    }

    function generateId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 9);
    }

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          saveItems(SAMPLE_ITEMS);
          return SAMPLE_ITEMS;
        }
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : SAMPLE_ITEMS;
      } catch {
        return SAMPLE_ITEMS;
      }
    }

    function saveItems(items) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        console.error(e);
      }
    }

    /* --- COMPONENTS --- */

    // Header
    function Header({ currentView, activeItemName, onBackToList, onResetSample, onDeleteItem }) {
      if (currentView === 'detail') {
        return html`
          <header class="mobile-appbar">
            <div class="appbar-left">
              <button class="btn-icon-mobile" onClick=${onBackToList} title="一覧に戻る">
                ←
              </button>
              <span class="appbar-title" style="font-size: 16.5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                ${activeItemName || 'アイテム詳細'}
              </span>
            </div>
            <div class="appbar-right">
              ${onDeleteItem && html`
                <button
                  class="btn-icon-mobile"
                  style="color: var(--danger);"
                  onClick=${onDeleteItem}
                  title="このアイテムを削除"
                >
                  🗑️
                </button>
              `}
            </div>
          </header>
        `;
      }

      return html`
        <header class="mobile-appbar">
          <div class="appbar-left">
            <span class="appbar-title">
              <span>✉️</span>
              <span>Zaiko</span>
            </span>
          </div>

          <div class="appbar-right">
            <button class="btn-icon-mobile" onClick=${onResetSample} title="初期サンプルデータを復元">
              🔄
            </button>
          </div>
        </header>
      `;
    }

    // ItemList (Mobile Inbox)
    function ItemList({
      items,
      selectedIds,
      searchQuery,
      sortBy,
      onSearchChange,
      onSortChange,
      onSelectItem,
      onToggleCheck,
      onToggleSelectAll,
      onOpenNewModal,
      onBatchToday,
      onOpenBatchDate,
      onBatchDelete
    }) {
      const isAllSelected = items.length > 0 && items.every(i => selectedIds.has(i.id));
      const hasSelection = selectedIds.size > 0;

      return html`
        <div class="view-container">
          <!-- Search Bar -->
          <div class="mobile-search-strip">
            <div class="search-pill">
              <span style="color: var(--text-muted); font-size: 15px;">🔍</span>
              <input
                type="text"
                class="search-pill-input"
                placeholder="アイテムを検索..."
                value=${searchQuery}
                onInput=${(e) => onSearchChange(e.target.value)}
              />
              ${searchQuery && html`
                <button
                  style="background: transparent; border: none; font-size: 14px; color: var(--text-muted); cursor: pointer;"
                  onClick=${() => onSearchChange('')}
                >
                  ✕
                </button>
              `}
            </div>
          </div>

          <!-- Subheader: Select all & Sort -->
          <div class="list-subheader">
            <label class="select-all-label">
              <input
                type="checkbox"
                class="checkbox-mobile"
                checked=${isAllSelected}
                onChange=${onToggleSelectAll}
              />
              <span>${hasSelection ? `${selectedIds.size} 件選択中` : `すべて (${items.length})`}</span>
            </label>

            <select
              class="sort-select-mobile"
              value=${sortBy}
              onChange=${(e) => onSortChange(e.target.value)}
            >
              <option value="lastPurchaseDesc">購入日: 新しい順</option>
              <option value="lastPurchaseAsc">購入日: 古い順</option>
              <option value="nameAsc">名前順</option>
              <option value="historyCountDesc">購入回数順</option>
            </select>
          </div>

          <!-- Scrollable List -->
          <div class="items-list-scroll">
            ${items.length === 0 ? html`
              <div style="padding: 60px 20px; text-align: center; color: var(--text-muted);">
                <div style="font-size: 32px; margin-bottom: 8px;">📭</div>
                <div style="font-size: 15px; font-weight: 500;">アイテムがありません</div>
                <div style="font-size: 12.5px; margin-top: 4px;">右下のボタンから追加してください</div>
              </div>
            ` : items.map(item => {
              const isChecked = selectedIds.has(item.id);
              const latest = item.purchaseHistory[0];
              const relDate = latest ? getRelativeDateString(latest.date) : '未購入';
              const isToday = relDate === '今日';

              return html`
                <div
                  key=${item.id}
                  class="mobile-item-card ${isChecked ? 'checked' : ''}"
                  onClick=${() => onSelectItem(item.id)}
                >
                  <div
                    class="item-check-hitarea"
                    onClick=${(e) => {
                      e.stopPropagation();
                      onToggleCheck(item.id, !isChecked);
                    }}
                  >
                    <input
                      type="checkbox"
                      class="checkbox-mobile"
                      checked=${isChecked}
                      readOnly
                    />
                  </div>

                  <div class="item-card-main">
                    <div class="item-card-row-top">
                      <span class="item-card-title">${item.name}</span>
                      <span class="item-card-date ${isToday ? 'is-today' : ''}">
                        ${relDate}
                      </span>
                    </div>
                    <div class="item-card-sub">
                      <span class="chip-history-count">${item.purchaseHistory.length}回購入</span>
                      ${latest ? html`<span>最終: ${latest.date}</span>` : null}
                    </div>
                  </div>

                  <span class="item-card-arrow">›</span>
                </div>
              `;
            })}
          </div>

          <!-- Floating Action Button (FAB) -->
          ${!hasSelection && html`
            <button class="fab-add" onClick=${onOpenNewModal}>
              <span style="font-size: 20px;">＋</span>
              <span>アイテム追加</span>
            </button>
          `}

          <!-- Bottom Batch Action Bar -->
          ${hasSelection && html`
            <div class="bottom-batch-bar">
              <span class="batch-count-badge">
                ${selectedIds.size} 件選択中
              </span>

              <div class="batch-actions-group">
                <button
                  class="btn-batch-action primary"
                  onClick=${onBatchToday}
                  title="今日購入として記録"
                >
                  <span>⚡ 今日</span>
                </button>

                <button
                  class="btn-batch-action"
                  onClick=${onOpenBatchDate}
                  title="日付を指定して記録"
                >
                  <span>📅 日付</span>
                </button>

                <button
                  class="btn-batch-action danger"
                  onClick=${onBatchDelete}
                  title="選択したアイテムを削除"

    // ItemDetail (Mobile Detail / Message View)
    function ItemDetail({ item, onRecordToday, onAddDate, onDeleteRecord, onDeleteItem }) {
      const [showAddInput, setShowAddInput] = useState(false);
      const [inputDate, setInputDate] = useState(getTodayString());

      const latest = item.purchaseHistory[0];

      const handleAddSubmit = (e) => {
        e.preventDefault();
        if (!inputDate) return;
        onAddDate(item.id, inputDate);
        setShowAddInput(false);
      };

      return html`
        <div class="detail-view">
          <div class="detail-view-content">
            <div class="detail-title-card">
              <h1 class="detail-item-title">${item.name}</h1>
            </div>

            <div class="status-highlight-box">
              <div>
                <div class="status-highlight-label">最新の購入日</div>
                <div class="status-highlight-value">
                  ${latest ? `${formatDate(latest.date)} (${getRelativeDateString(latest.date)})` : '未記録'}
                </div>
              </div>
              <div style="text-align: right;">
                <div class="status-highlight-label">購入回数</div>
                <div class="status-highlight-value">
                  ${item.purchaseHistory.length} 回
                </div>
              </div>
            </div>

            <!-- Big thumb button -->
            <button
              class="btn-today-big"
              onClick=${() => onRecordToday(item.id)}
            >
              <span style="font-size: 18px;">⚡</span>
              <span>今日購入を記録する</span>
            </button>

            <!-- History Block -->
            <div class="history-block">
              <div class="history-header-row">
                <span class="history-heading">購入日履歴</span>
                <button
                  class="btn-add-past-date"
                  onClick=${() => setShowAddInput(!showAddInput)}
                >
                  ${showAddInput ? '閉じる' : '＋ 過去の日付を追加'}
                </button>
              </div>

              ${showAddInput && html`
                <form class="mobile-add-date-form" onSubmit=${handleAddSubmit}>
                  <span style="font-size: 13px; font-weight: 600; color: var(--primary);">
                    購入日を指定して追加:
                  </span>
                  <input
                    type="date"
                    class="input-mobile"
                    value=${inputDate}
                    required
                    onInput=${(e) => setInputDate(e.target.value)}
                  />
                  <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button
                      type="button"
                      class="btn-sheet-secondary"
                      style="flex: none; padding: 8px 14px; font-size: 13px;"
                      onClick=${() => setShowAddInput(false)}
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      class="btn-sheet-primary"
                      style="flex: none; padding: 8px 16px; font-size: 13px;"
                    >
                      追加
                    </button>
                  </div>
                </form>
              `}

              ${item.purchaseHistory.length === 0 ? html`
                <div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; background: #fafafa; border-radius: 8px;">
                  購入日履歴がまだありません。上のボタンから今日購入を記録できます。
                </div>
              ` : html`
                <div class="history-timeline-mobile">
                  ${item.purchaseHistory.map(record => html`
                    <div key=${record.id} class="history-card-mobile">
                      <div class="history-card-left">
                        <span class="history-card-date">${formatDate(record.date)}</span>
                        <span class="history-card-rel">${getRelativeDateString(record.date)}</span>
                      </div>
                      <button
                        class="btn-del-record-mobile"
                        title="この記録を削除"
                        onClick=${() => onDeleteRecord(item.id, record.id)}
                      >
                        ✕
                      </button>
                    </div>
                  `)}
                </div>
              `}
            </div>

            <!-- Danger Zone -->
            <div class="danger-zone">
              <button
                class="btn-delete-item-full"
                onClick=${() => onDeleteItem(item.id)}
              >
                🗑️ このアイテムを削除
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // NewItemModal (Bottom Sheet)
    function NewItemModal({ isOpen, onClose, onSubmit }) {
      if (!isOpen) return null;
      const [name, setName] = useState('');
      const [recordInitial, setRecordInitial] = useState(true);
      const [purchaseDate, setPurchaseDate] = useState(getTodayString());

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onSubmit({
          name: name.trim(),
          initialPurchaseDate: recordInitial ? purchaseDate : undefined
        });
        onClose();
      };

      return html`
        <div class="modal-overlay" onClick=${onClose}>
          <div class="bottom-sheet" onClick=${(e) => e.stopPropagation()}>
            <div class="sheet-header">
              <span class="sheet-title">新規アイテムを追加</span>
              <button
                class="btn-icon-mobile"
                style="width: 32px; height: 32px;"
                onClick=${onClose}
              >
                ✕
              </button>
            </div>

            <form onSubmit=${handleSubmit}>
              <div class="sheet-body">
                <div>
                  <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">
                    アイテム名 *
                  </label>
                  <input
                    type="text"
                    class="input-mobile"
                    placeholder="例: シャンプー、コーヒー豆"
                    value=${name}
                    required
                    autoFocus
                    onInput=${(e) => setName(e.target.value)}
                  />
                </div>

                <div style="background-color: #f8f9fa; border-radius: 8px; padding: 12px; border: 1px solid var(--border-color);">
                  <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; cursor: pointer;">
                    <input
                      type="checkbox"
                      class="checkbox-mobile"
                      checked=${recordInitial}
                      onChange=${(e) => setRecordInitial(e.target.checked)}
                    />
                    <span>初回の購入日も記録する</span>
                  </label>

                  ${recordInitial && html`
                    <div style="margin-top: 10px;">
                      <input
                        type="date"
                        class="input-mobile"
                        value=${purchaseDate}
                        onInput=${(e) => setPurchaseDate(e.target.value)}
                      />
                    </div>
                  `}
                </div>
              </div>

              <div class="sheet-footer">
                <button
                  type="button"
                  class="btn-sheet-secondary"
                  onClick=${onClose}
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  class="btn-sheet-primary"
                >
                  追加する
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // BatchDateModal (Bottom Sheet)
    function BatchDateModal({ isOpen, selectedItems, onClose, onSubmit }) {
      if (!isOpen) return null;
      const [date, setDate] = useState(getTodayString());

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!date) return;
        onSubmit(date);
        onClose();
      };

      return html`
        <div class="modal-overlay" onClick=${onClose}>
          <div class="bottom-sheet" onClick=${(e) => e.stopPropagation()}>
            <div class="sheet-header">
              <span class="sheet-title">日付を指定して一括記録</span>
              <button
                class="btn-icon-mobile"
                style="width: 32px; height: 32px;"
                onClick=${onClose}
              >
                ✕
              </button>
            </div>

            <form onSubmit=${handleSubmit}>
              <div class="sheet-body">
                <div style="font-size: 13.5px; color: var(--text-secondary);">
                  選択した <strong>${selectedItems.length} 件</strong> のアイテムに購入日をまとめて記録します。
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 6px; max-height: 90px; overflow-y: auto; padding: 6px; background-color: #f8f9fa; border-radius: 8px;">
                  ${selectedItems.map(item => html`
                    <span style="font-size: 11.5px; background: #e8f0fe; color: #1967d2; padding: 3px 8px; border-radius: 4px; font-weight: 500;">
                      ${item.name}
                    </span>
                  `)}
                </div>

                <div>
                  <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">
                    購入日 *
                  </label>
                  <input
                    type="date"
                    class="input-mobile"
                    value=${date}
                    required
                    onInput=${(e) => setDate(e.target.value)}
                  />
                </div>
              </div>

              <div class="sheet-footer">
                <button
                  type="button"
                  class="btn-sheet-secondary"
                  onClick=${onClose}
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  class="btn-sheet-primary"
                >
                  一括記録する
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // App Root
    function App() {
      const [items, setItems] = useState([]);
      const [selectedIds, setSelectedIds] = useState(new Set());
      const [activeId, setActiveId] = useState(null);
      const [currentView, setCurrentView] = useState('list');
      const [toastMessage, setToastMessage] = useState(null);

      const [filter, setFilter] = useState({
        searchQuery: '',
        sortBy: 'lastPurchaseDesc'
      });

      const [isNewModalOpen, setIsNewModalOpen] = useState(false);
      const [isBatchDateModalOpen, setIsBatchDateModalOpen] = useState(false);

      useEffect(() => {
        const loaded = loadItems();
        setItems(loaded);
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage((cur) => (cur === msg ? null : cur));
        }, 2600);
      };

      const filteredItems = useMemo(() => {
        let result = [...items];
        if (filter.searchQuery.trim()) {
          const q = filter.searchQuery.toLowerCase();
          result = result.filter(item => item.name.toLowerCase().includes(q));
        }

        result.sort((a, b) => {
          if (filter.sortBy === 'nameAsc') return a.name.localeCompare(b.name, 'ja');
          if (filter.sortBy === 'historyCountDesc') return b.purchaseHistory.length - a.purchaseHistory.length;
          const dateA = a.purchaseHistory[0]?.date || '';
          const dateB = b.purchaseHistory[0]?.date || '';
          if (filter.sortBy === 'lastPurchaseAsc') {
            if (!dateA) return 1;
            if (!dateB) return -1;
            return dateA.localeCompare(dateB);
          }
          if (!dateA) return 1;
          if (!dateB) return -1;
          return dateB.localeCompare(dateA);
        });

        return result;
      }, [items, filter]);

      const activeItem = useMemo(() => {
        return items.find(i => i.id === activeId) || null;
      }, [items, activeId]);

      const handleSelectItem = (id) => {
        setActiveId(id);
        setCurrentView('detail');
      };

      const handleBackToList = () => {
        setCurrentView('list');
      };

      const handleToggleCheck = (id, checked) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          if (checked) next.add(id);
          else next.delete(id);
          return next;
        });
      };

      const handleToggleSelectAll = () => {
        const isAll = filteredItems.length > 0 && filteredItems.every(i => selectedIds.has(i.id));
        if (isAll) {
          setSelectedIds(new Set());
        } else {
          const next = new Set(selectedIds);
          filteredItems.forEach(i => next.add(i.id));
          setSelectedIds(next);
        }
      };

      // 複数アイテムに「今日」を一括記録
      const handleBatchToday = () => {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;
        const today = getTodayString();
        const idSet = new Set(ids);

        const nextItems = items.map(item => {
          if (idSet.has(item.id)) {
            const history = [{ id: generateId(), date: today }, ...item.purchaseHistory]
              .sort((a, b) => b.date.localeCompare(a.date));
            return { ...item, purchaseHistory: history, updatedAt: new Date().toISOString() };
          }
          return item;
        });

        saveItems(nextItems);
        setItems(nextItems);
        setSelectedIds(new Set());
        showToast(`⚡ ${ids.length} 件の購入日を今日で記録しました`);
      };

      // 複数アイテムに「指定日」を一括記録
      const handleBatchCustomDate = (date) => {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;
        const idSet = new Set(ids);

        const nextItems = items.map(item => {
          if (idSet.has(item.id)) {
            const history = [{ id: generateId(), date }, ...item.purchaseHistory]
              .sort((a, b) => b.date.localeCompare(a.date));
            return { ...item, purchaseHistory: history, updatedAt: new Date().toISOString() };
          }
          return item;
        });

        saveItems(nextItems);
        setItems(nextItems);
        setSelectedIds(new Set());
        showToast(`📅 ${ids.length} 件の購入日 (${date}) を一括記録しました`);
      };

      // 複数アイテム一括削除
      const handleBatchDelete = () => {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;
        if (!confirm(`選択した ${ids.length} 件のアイテムを削除しますか？`)) return;

        const idSet = new Set(ids);
        const nextItems = items.filter(item => !idSet.has(item.id));
        saveItems(nextItems);
        setItems(nextItems);
        setSelectedIds(new Set());
        showToast(`${ids.length} 件のアイテムを削除しました`);
      };

      // 詳細画面からの今日記録
      const handleRecordToday = (itemId) => {
        const today = getTodayString();
        const nextItems = items.map(item => {
          if (item.id === itemId) {
            const history = [{ id: generateId(), date: today }, ...item.purchaseHistory]
              .sort((a, b) => b.date.localeCompare(a.date));
            return { ...item, purchaseHistory: history, updatedAt: new Date().toISOString() };
          }
          return item;
        });
        saveItems(nextItems);
        setItems(nextItems);
        const target = items.find(i => i.id === itemId);
        showToast(`⚡ 「${target?.name}」の購入日を今日で記録しました`);
      };

      // 詳細画面からの日付追加
      const handleAddDate = (itemId, date) => {
        const nextItems = items.map(item => {
          if (item.id === itemId) {
            const history = [{ id: generateId(), date }, ...item.purchaseHistory]
              .sort((a, b) => b.date.localeCompare(a.date));
            return { ...item, purchaseHistory: history, updatedAt: new Date().toISOString() };
          }
          return item;
        });
        saveItems(nextItems);
        setItems(nextItems);
        showToast(`📅 購入日 (${date}) を追加しました`);
      };

      // 購入日履歴個別削除
      const handleDeleteRecord = (itemId, recordId) => {
        if (!confirm('この購入日を削除しますか？')) return;
        const nextItems = items.map(item => {
          if (item.id === itemId) {
            return {
              ...item,
              purchaseHistory: item.purchaseHistory.filter(r => r.id !== recordId),
              updatedAt: new Date().toISOString()
            };
          }
          return item;
        });
        saveItems(nextItems);
        setItems(nextItems);
        showToast('購入日を削除しました');
      };

      // アイテム新規追加
      const handleCreateNewItem = (input) => {
        const now = new Date().toISOString();
        const history = [];
        if (input.initialPurchaseDate) {
          history.push({ id: generateId(), date: input.initialPurchaseDate });
        }
        const newItem = {
          id: generateId(),
          name: input.name,
          purchaseHistory: history,
          createdAt: now,
          updatedAt: now
        };
        const nextItems = [newItem, ...items];
        saveItems(nextItems);
        setItems(nextItems);
        setActiveId(newItem.id);
        setCurrentView('detail');
        showToast(`「${newItem.name}」を追加しました`);
      };

      // 単一アイテム削除
      const handleDeleteItem = (itemId) => {
        const target = items.find(i => i.id === itemId);
        if (!confirm(`「${target?.name}」を削除しますか？`)) return;

        const nextItems = items.filter(i => i.id !== itemId);
        saveItems(nextItems);
        setItems(nextItems);
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.delete(itemId);
          return next;
        });
        setCurrentView('list');
        showToast('アイテムを削除しました');
      };

      // サンプル復元
      const handleResetSample = () => {
        if (!confirm('初期サンプルデータにリセットしますか？')) return;
        const reset = [
          {
            id: 'item-1',
            name: 'トイレットペーパー',
            purchaseHistory: [
              { id: 'rec-1-1', date: '2026-10-24' },
              { id: 'rec-1-2', date: '2026-09-28' },
              { id: 'rec-1-3', date: '2026-09-02' }
            ],
            createdAt: '2026-09-01T09:00:00Z',
            updatedAt: '2026-10-24T10:00:00Z'
          },
          {
            id: 'item-2',
            name: '食器用洗剤',
            purchaseHistory: [
              { id: 'rec-2-1', date: '2026-10-18' },
              { id: 'rec-2-2', date: '2026-08-30' }
            ],
            createdAt: '2026-08-30T11:00:00Z',
            updatedAt: '2026-10-18T16:20:00Z'
          },
          {
            id: 'item-3',
            name: 'コーヒー豆',
            purchaseHistory: [
              { id: 'rec-3-1', date: '2026-10-10' },
              { id: 'rec-3-2', date: '2026-09-15' },
              { id: 'rec-3-3', date: '2026-08-20' }
            ],
            createdAt: '2026-08-20T17:00:00Z',
            updatedAt: '2026-10-10T12:00:00Z'
          },
          {
            id: 'item-4',
            name: '洗濯洗剤',
            purchaseHistory: [
              { id: 'rec-4-1', date: '2026-09-10' }
            ],
            createdAt: '2026-09-10T08:00:00Z',
            updatedAt: '2026-09-10T08:00:00Z'
          },
          {
            id: 'item-5',
            name: 'オリーブオイル',
            purchaseHistory: [
              { id: 'rec-5-1', date: '2026-08-15' }
            ],
            createdAt: '2026-08-15T14:00:00Z',
            updatedAt: '2026-08-15T14:00:00Z'
          },
          {
            id: 'item-6',
            name: '目薬',
            purchaseHistory: [
              { id: 'rec-6-1', date: '2026-09-25' }
            ],
            createdAt: '2026-09-25T19:00:00Z',
            updatedAt: '2026-09-25T19:00:00Z'
          }
        ];
        saveItems(reset);
        setItems(reset);
        setSelectedIds(new Set());
        setActiveId(null);
        setCurrentView('list');
        showToast('サンプルデータを復元しました');
      };

      return html`
        <div id="app">
          <${Header}
            currentView=${currentView}
            activeItemName=${activeItem?.name}
            onBackToList=${handleBackToList}
            onResetSample=${handleResetSample}
            onDeleteItem=${currentView === 'detail' && activeItem ? () => handleDeleteItem(activeItem.id) : undefined}
          />

          ${currentView === 'list' ? html`
            <${ItemList}
              items=${filteredItems}
              selectedIds=${selectedIds}
              searchQuery=${filter.searchQuery}
              sortBy=${filter.sortBy}
              onSearchChange=${(q) => setFilter(prev => ({ ...prev, searchQuery: q }))}
              onSortChange=${(sortBy) => setFilter(prev => ({ ...prev, sortBy }))}
              onSelectItem=${handleSelectItem}
              onToggleCheck=${handleToggleCheck}
              onToggleSelectAll=${handleToggleSelectAll}
              onOpenNewModal=${() => setIsNewModalOpen(true)}
              onBatchToday=${handleBatchToday}
              onOpenBatchDate=${() => setIsBatchDateModalOpen(true)}
              onBatchDelete=${handleBatchDelete}
            />
          ` : html`
            ${activeItem && html`
              <${ItemDetail}
                item=${activeItem}
                onRecordToday=${handleRecordToday}
                onAddDate=${handleAddDate}
                onDeleteRecord=${handleDeleteRecord}
                onDeleteItem=${handleDeleteItem}
              />
            `}
          `}

          <${NewItemModal}
            isOpen=${isNewModalOpen}
            onClose=${() => setIsNewModalOpen(false)}
            onSubmit=${handleCreateNewItem}
          />

          <${BatchDateModal}
            isOpen=${isBatchDateModalOpen}
            selectedItems=${items.filter(i => selectedIds.has(i.id))}
            onClose=${() => setIsBatchDateModalOpen(false)}
            onSubmit=${handleBatchCustomDate}
          />

          ${toastMessage && html`
            <div class="mobile-toast">
              ${toastMessage}
            </div>
          `}
        </div>
      `;
    }

    render(h(App, null), document.getElementById('root'));
  </script>
</body>
</html>
